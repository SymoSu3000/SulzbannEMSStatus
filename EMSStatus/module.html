<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<style>

* {
    box-sizing: border-box;
}


/* ============================================================
   THEME
============================================================ */

:root {
    color-scheme: light dark;

    --text: #20262b;
    --muted: #66737b;

    --border:
        rgba(0, 0, 0, 0.14);

    --yellow: #e5a900;
    --blue: #149be3;
    --green: #00b87a;
    --orange: #f28a1b;
    --purple: #a34fe0;
}


@media (prefers-color-scheme: dark) {

    :root {
        --text: #f2f7fa;
        --muted: #a7bdc9;

        --border:
            rgba(120, 160, 178, 0.30);

        --yellow: #ffc83d;
        --blue: #32a7f4;
        --green: #25da91;
        --orange: #ff9d2d;
        --purple: #bb70ff;
    }

}


/* ============================================================
   BASIS
============================================================ */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/*
 * Wichtig:
 *
 * Oben bewusst Leerraum für den Symcon-Kacheltitel.
 *
 * Die drei eigentlichen EMS-Bereiche liegen danach
 * lückenlos aneinander:
 *
 * Ziel / Prognose
 * ----------------
 * Programm
 * ----------------
 * PV / Netz / SOC / Limit
 */

.ems {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows:
        minmax(0, 1fr)
        auto
        minmax(0, 1fr);

    overflow: hidden;

    padding:
        28px
        8px
        8px
        8px;

    background: transparent;
}


/* ============================================================
   OBEN
   NÄCHSTES ZIEL | PV-PROGNOSE
============================================================ */

.top-row {
    min-height: 0;

    width: 100%;

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    align-items: stretch;

    /*
     * Untere Linie des oberen Bereichs.
     */
    border-bottom:
        1px solid
        var(--border);
}


.info-block {
    min-width: 0;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        6px
        10px;
}


/*
 * Die senkrechte Mittellinie endet exakt
 * auf der horizontalen Linie unten.
 */

.info-block + .info-block {
    border-left:
        1px solid
        var(--border);
}


.info-inner {
    display: grid;

    grid-template-columns:
        42px
        minmax(0, auto);

    align-items: center;

    column-gap: 11px;

    min-width: 0;
}


/* ============================================================
   OBERE SYMBOLE
============================================================ */

.big-icon {
    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 33px;

    line-height: 1;
}


.target-icon {
    color: var(--purple);
}


.forecast-icon {
    color: var(--yellow);
}


/* ============================================================
   OBERE TEXTE
============================================================ */

.info-text {
    min-width: 0;

    text-align: left;
}


.info-label {
    color: var(--muted);

    font-size: 12px;

    line-height: 1.15;

    white-space: nowrap;
}


.info-main {
    margin-top: 3px;

    color: var(--text);

    font-size: 22px;

    line-height: 1.05;

    font-weight: 700;

    white-space: nowrap;
}


.info-sub {
    margin-top: 4px;

    max-width: 215px;

    overflow: hidden;

    color: var(--muted);

    font-size: 12px;

    line-height: 1.15;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   MITTE
   TAGESPROGRAMM
============================================================ */

.program-row {
    width: 100%;

    min-height: 34px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        5px
        8px;

    /*
     * Oben KEINE zweite Linie.
     * Die Linie kommt bereits von .top-row.
     *
     * Dadurch keine Doppel- oder Lückenlinie.
     */

    border-bottom:
        1px solid
        var(--border);
}


.program-line {
    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    text-align: center;
}


.program-icon {
    flex: 0 0 auto;

    color: var(--yellow);

    font-size: 19px;

    line-height: 1;
}


.program-text {
    min-width: 0;

    overflow: hidden;

    color: var(--text);

    font-size: 12px;

    font-weight: 600;

    line-height: 1.2;

    text-align: center;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   UNTEN
   PV | NETZ | SOC | GESAMTLIMIT
============================================================ */

.bottom-row {
    min-height: 0;

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0, 1fr)
        );

    align-items: stretch;
}


.metric {
    min-width: 0;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        4px
        5px;
}


/*
 * Die senkrechten Trennlinien beginnen exakt
 * an der horizontalen Linie der Programmzeile.
 */

.metric + .metric {
    border-left:
        1px solid
        var(--border);
}


.metric-inner {
    display: grid;

    grid-template-columns:
        31px
        auto;

    column-gap: 8px;

    align-items: center;

    justify-content: center;

    min-width: 0;
}


/* ============================================================
   UNTERE SYMBOLE
============================================================ */

.metric-icon {
    width: 31px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 27px;

    line-height: 1;
}


.metric-icon.pv {
    color: var(--yellow);
}


.metric-icon.grid {
    color: var(--blue);
}


.metric-icon.soc {
    color: var(--green);
}


.metric-icon.limit {
    color: var(--orange);
}


/* ============================================================
   UNTERE TEXTE
============================================================ */

.metric-text {
    min-width: 60px;

    text-align: left;
}


.metric-label {
    color: var(--muted);

    font-size: 12px;

    line-height: 1.1;

    white-space: nowrap;
}


.metric-value {
    margin-top: 4px;

    color: var(--text);

    font-size: 20px;

    line-height: 1.05;

    font-weight: 700;

    white-space: nowrap;
}


/* ============================================================
   DESKTOP COMPACT
============================================================ */

@media (max-height: 310px) {

    /*
     * Auch hier genügend Abstand zum Symcon-Titel.
     */

    .ems {
        padding:
            25px
            7px
            6px
            7px;
    }


    .info-block {
        padding:
            4px
            6px;
    }


    .info-inner {
        grid-template-columns:
            29px
            auto;

        column-gap: 7px;
    }


    .big-icon {
        width: 29px;
        height: 29px;

        font-size: 25px;
    }


    .info-label {
        font-size: 12px;
    }


    .info-main {
        margin-top: 2px;

        font-size: 17px;
    }


    .info-sub {
        margin-top: 2px;

        max-width: 160px;

        font-size: 12px;
    }


    .program-row {
        min-height: 30px;

        padding:
            4px
            6px;
    }


    .program-icon {
        font-size: 17px;
    }


    .program-text {
        font-size: 12px;
    }


    .metric {
        padding:
            3px
            4px;
    }


    .metric-inner {
        grid-template-columns:
            27px
            auto;

        column-gap: 6px;
    }


    .metric-icon {
        width: 27px;

        font-size: 24px;
    }


    .metric-text {
        min-width: 55px;
    }


    .metric-label {
        font-size: 12px;
    }


    .metric-value {
        margin-top: 3px;

        font-size: 16px;
    }

}


/* ============================================================
   MOBILE
   KLEINSTE SCHRIFT = 12 PX
============================================================ */

@media (max-width: 520px) {

    /*
     * Auf Mobile ist der Symcon-Titel sehr gross.
     * Deshalb oben nochmals etwas mehr Abstand.
     */

    .ems {
        padding:
            38px
            8px
            8px
            8px;
    }


    /* --------------------------------------------------------
       OBEN
    --------------------------------------------------------- */

    .info-block {
        padding:
            5px
            5px;
    }


    .info-inner {
        grid-template-columns:
            38px
            minmax(0, auto);

        column-gap: 8px;
    }


    .big-icon {
        width: 38px;
        height: 38px;

        font-size: 33px;
    }


    .info-label {
        font-size: 12px;

        line-height: 1.1;
    }


    .info-main {
        margin-top: 3px;

        font-size: 18px;
    }


    .info-sub {
        margin-top: 4px;

        max-width: 145px;

        font-size: 12px;

        line-height: 1.15;
    }


    /* --------------------------------------------------------
       PROGRAMM
    --------------------------------------------------------- */

    .program-row {
        min-height: 36px;

        padding:
            6px
            8px;
    }


    .program-line {
        gap: 9px;
    }


    .program-icon {
        font-size: 21px;
    }


    .program-text {
        font-size: 13px;

        font-weight: 650;
    }


    /* --------------------------------------------------------
       UNTEN
    --------------------------------------------------------- */

    .metric {
        padding:
            4px
            2px;
    }


    .metric-inner {
        grid-template-columns:
            34px
            auto;

        column-gap: 6px;
    }


    .metric-icon {
        width: 34px;

        font-size: 30px;
    }


    .metric-text {
        min-width: 0;
    }


    .metric-label {
        font-size: 12px;
    }


    .metric-value {
        margin-top: 4px;

        font-size: 18px;
    }

}


/* ============================================================
   GROSSE DESKTOPANSICHT
============================================================ */

@media
    (min-width: 900px)
    and
    (min-height: 500px)
{

    .ems {
        padding:
            42px
            28px
            18px
            28px;
    }


    .info-block {
        padding:
            10px
            25px;
    }


    .info-inner {
        grid-template-columns:
            60px
            auto;

        column-gap: 20px;
    }


    .big-icon {
        width: 60px;
        height: 60px;

        font-size: 48px;
    }


    .info-label {
        font-size: 17px;
    }


    .info-main {
        margin-top: 5px;

        font-size: 31px;
    }


    .info-sub {
        margin-top: 7px;

        max-width: 390px;

        font-size: 15px;
    }


    .program-row {
        min-height: 46px;

        padding:
            8px
            12px;
    }


    .program-icon {
        font-size: 22px;
    }


    .program-text {
        font-size: 16px;
    }


    .metric {
        padding:
            10px
            15px;
    }


    .metric-inner {
        grid-template-columns:
            48px
            auto;

        column-gap: 15px;
    }


    .metric-icon {
        width: 48px;

        font-size: 40px;
    }


    .metric-text {
        min-width: 100px;
    }


    .metric-label {
        font-size: 16px;
    }


    .metric-value {
        margin-top: 5px;

        font-size: 29px;
    }

}

</style>

</head>


<body>


<div class="ems">


    <!-- ========================================================
         OBEN
    ========================================================= -->

    <div class="top-row">


        <!-- NÄCHSTES ZIEL -->

        <div class="info-block">

            <div class="info-inner">

                <div
                    class="
                        big-icon
                        target-icon
                    "
                >
                    ◎
                </div>


                <div class="info-text">

                    <div class="info-label">
                        Nächstes Ziel
                    </div>


                    <div
                        class="info-main"
                        id="target"
                    >
                        —
                    </div>


                    <div
                        class="info-sub"
                        id="targetSub"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>



        <!-- PV-PROGNOSE -->

        <div class="info-block">

            <div class="info-inner">

                <div
                    class="
                        big-icon
                        forecast-icon
                    "
                >
                    ▥
                </div>


                <div class="info-text">

                    <div class="info-label">
                        PV-Prognose
                    </div>


                    <div
                        class="info-main"
                        id="forecast"
                    >
                        —
                    </div>


                    <div
                        class="info-sub"
                        id="forecastSub"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>


    </div>



    <!-- ========================================================
         MITTE
         TAGESPROGRAMM
    ========================================================= -->

    <div class="program-row">

        <div class="program-line">

            <span
                class="program-icon"
                id="programIcon"
            >
                ☀
            </span>

            <span
                class="program-text"
                id="program"
            >
                —
            </span>

        </div>

    </div>



    <!-- ========================================================
         UNTEN
    ========================================================= -->

    <div class="bottom-row">


        <!-- PV -->

        <div class="metric">

            <div class="metric-inner">

                <div
                    class="
                        metric-icon
                        pv
                    "
                >
                    ☀
                </div>


                <div class="metric-text">

                    <div class="metric-label">
                        PV
                    </div>


                    <div
                        class="metric-value"
                        id="pv"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>



        <!-- NETZ -->

        <div class="metric">

            <div class="metric-inner">

                <div
                    class="
                        metric-icon
                        grid
                    "
                >
                    ↔
                </div>


                <div class="metric-text">

                    <div class="metric-label">
                        Netz
                    </div>


                    <div
                        class="metric-value"
                        id="grid"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>



        <!-- SOC -->

        <div class="metric">

            <div class="metric-inner">

                <div
                    class="
                        metric-icon
                        soc
                    "
                >
                    ▣
                </div>


                <div class="metric-text">

                    <div class="metric-label">
                        SOC
                    </div>


                    <div
                        class="metric-value"
                        id="soc"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>



        <!-- GESAMTLIMIT -->

        <div class="metric">

            <div class="metric-inner">

                <div
                    class="
                        metric-icon
                        limit
                    "
                >
                    ⚡
                </div>


                <div class="metric-text">

                    <div class="metric-label">
                        Gesamtlimit
                    </div>


                    <div
                        class="metric-value"
                        id="limit"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>


    </div>


</div>



<script>


/* ============================================================
   HILFSFUNKTIONEN
============================================================ */

function numeric(
    value,
    decimals = 1
) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return null;
    }

    return Number(value)
        .toFixed(decimals);
}


function power(value) {

    const result =
        numeric(
            value,
            1
        );

    if (result === null) {
        return "—";
    }

    return (
        result +
        " kW"
    );
}


function energy(value) {

    const result =
        numeric(
            value,
            1
        );

    if (result === null) {
        return "—";
    }

    return (
        result +
        " kWh"
    );
}


function percent(value) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return "—";
    }

    return (
        Math.round(
            Number(value)
        ) +
        " %"
    );
}


function setText(
    id,
    value
) {

    const element =
        document.getElementById(
            id
        );

    if (!element) {
        return;
    }

    element.textContent =
        value;
}


/* ============================================================
   PROGRAMM-SYMBOL
============================================================ */

function getProgramIcon(
    program
) {

    const value =
        String(
            program || ""
        ).toLowerCase();


    if (
        value.includes("hochsommer") ||
        value.includes("sommer")
    ) {
        return "☀";
    }


    if (
        value.includes("winter")
    ) {
        return "❄";
    }


    if (
        value.includes("übergang") ||
        value.includes("uebergang")
    ) {
        return "◐";
    }


    return "●";
}


/* ============================================================
   LIVE-DATEN
============================================================ */

function handleMessage(data) {

    if (
        typeof data ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }

    }


    if (
        !data ||
        typeof data !==
        "object"
    ) {
        return;
    }



    /* ========================================================
       PROGRAMM
    ========================================================= */

    const program =
        data.program
            ? String(
                data.program
            )
            : "—";


    setText(
        "program",
        program
    );


    setText(
        "programIcon",
        getProgramIcon(
            program
        )
    );



    /* ========================================================
       NÄCHSTES ZIEL
    ========================================================= */

    let targetText =
        "—";


    if (
        data.targetTime !== null &&
        data.targetTime !== undefined &&
        data.targetTime !== "" &&
        data.targetSOC !== null &&
        data.targetSOC !== undefined
    ) {

        targetText =
            String(
                data.targetTime
            ) +
            " / " +
            Math.round(
                Number(
                    data.targetSOC
                )
            ) +
            " %";
    }


    setText(
        "target",
        targetText
    );


    let targetDetails =
        [];


    const need =
        power(
            data.socNeed
        );


    if (
        need !== "—"
    ) {

        targetDetails.push(
            "SOC-Ladebedarf " +
            need
        );
    }


    if (
        data.consumers !== null &&
        data.consumers !== undefined &&
        data.consumers !== ""
    ) {

        targetDetails.push(
            "Verbraucher " +
            data.consumers
        );
    }


    setText(
        "targetSub",

        targetDetails.length
            ? targetDetails.join(
                " · "
            )
            : "—"
    );



    /* ========================================================
       PV-PROGNOSE
    ========================================================= */

    setText(
        "forecast",
        energy(
            data.forecastEnergy
        )
    );


    let forecastDetails =
        [];


    const peak =
        power(
            data.forecastPeak
        );


    if (
        peak !== "—"
    ) {

        forecastDetails.push(
            "Peak " +
            peak
        );
    }


    const duration =
        numeric(
            data.forecastDuration,
            1
        );


    if (
        duration !== null
    ) {

        forecastDetails.push(
            "Dauer " +
            duration +
            " h"
        );
    }


    setText(
        "forecastSub",

        forecastDetails.length
            ? forecastDetails.join(
                " · "
            )
            : "—"
    );



    /* ========================================================
       UNTEN
    ========================================================= */

    setText(
        "pv",
        power(
            data.pv
        )
    );


    setText(
        "grid",
        power(
            data.grid
        )
    );


    setText(
        "soc",
        percent(
            data.soc
        )
    );


    setText(
        "limit",
        power(
            data.limit
        )
    );

}


/* ============================================================
   INITIALISIERUNG
============================================================ */

window.addEventListener(
    "load",
    function () {

        if (
            typeof requestAction ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );

        }

    }
);


</script>


</body>

</html>
