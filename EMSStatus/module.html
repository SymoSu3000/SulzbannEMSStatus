<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<style>

* {
    box-sizing: border-box;
}


/* ============================================================
   THEME
============================================================ */

:root {
    color-scheme: light dark;

    --text: #20262b;
    --muted: #66737b;

    --border:
        rgba(0, 0, 0, 0.13);

    --yellow: #e5a900;
    --blue: #149be3;
    --green: #00b87a;
    --orange: #f28a1b;
    --purple: #a34fe0;

    --program-bg:
        rgba(229, 169, 0, 0.08);

    --program-border:
        rgba(229, 169, 0, 0.32);
}


@media (prefers-color-scheme: dark) {

    :root {
        --text: #f2f7fa;
        --muted: #a7bdc9;

        --border:
            rgba(120, 160, 178, 0.27);

        --yellow: #ffc83d;
        --blue: #32a7f4;
        --green: #25da91;
        --orange: #ff9d2d;
        --purple: #bb70ff;

        --program-bg:
            rgba(255, 200, 61, 0.08);

        --program-border:
            rgba(255, 200, 61, 0.30);
    }

}


/* ============================================================
   BASIS
============================================================ */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


.ems {
    position: relative;

    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows:
        1fr
        1fr;

    overflow: hidden;

    padding:
        7px
        10px
        8px
        10px;

    background: transparent;
}


/* ============================================================
   TAGESPROGRAMM
============================================================ */

.program-badge {
    position: absolute;

    z-index: 10;

    top: 5px;
    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 5px;

    max-width: 45%;

    padding:
        3px
        8px;

    border:
        1px solid
        var(--program-border);

    border-radius:
        999px;

    background:
        var(--program-bg);

    color:
        var(--text);

    font-size: 12px;

    line-height: 1;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.program-icon {
    color: var(--yellow);

    font-size: 14px;
}


.program-text {
    overflow: hidden;

    text-overflow: ellipsis;
}


/* ============================================================
   OBEN
============================================================ */

.top-row {
    min-height: 0;

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    align-items: center;

    padding-top: 13px;

    border-bottom:
        1px solid
        var(--border);
}


.info-block {
    min-width: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        5px
        14px;
}


.info-block + .info-block {
    border-left:
        1px solid
        var(--border);
}


.info-inner {
    display: grid;

    grid-template-columns:
        42px
        minmax(0, auto);

    align-items: center;

    column-gap: 11px;
}


.big-icon {
    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 33px;

    line-height: 1;
}


.target-icon {
    color: var(--purple);
}


.forecast-icon {
    color: var(--yellow);
}


.info-text {
    min-width: 0;

    text-align: left;
}


.info-label {
    color: var(--muted);

    font-size: 12px;

    white-space: nowrap;
}


.info-main {
    margin-top: 2px;

    color: var(--text);

    font-size: 22px;

    line-height: 1.05;

    font-weight: 700;

    white-space: nowrap;
}


.info-sub {
    margin-top: 4px;

    max-width: 210px;

    overflow: hidden;

    color: var(--muted);

    font-size: 12px;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   UNTEN
============================================================ */

.bottom-row {
    min-height: 0;

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0, 1fr)
        );

    align-items: stretch;
}


.metric {
    min-width: 0;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        4px
        6px;
}


.metric + .metric {
    border-left:
        1px solid
        var(--border);
}


.metric-inner {
    display: grid;

    grid-template-columns:
        30px
        auto;

    column-gap: 8px;

    align-items: center;

    justify-content: center;

    min-width: 0;
}


.metric-icon {
    width: 30px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 26px;

    line-height: 1;
}


.metric-icon.pv {
    color: var(--yellow);
}


.metric-icon.grid {
    color: var(--blue);
}


.metric-icon.soc {
    color: var(--green);
}


.metric-icon.limit {
    color: var(--orange);
}


.metric-text {
    min-width: 60px;

    text-align: left;
}


.metric-label {
    color: var(--muted);

    font-size: 12px;

    line-height: 1.1;

    white-space: nowrap;
}


.metric-value {
    margin-top: 3px;

    color: var(--text);

    font-size: 20px;

    line-height: 1.05;

    font-weight: 700;

    white-space: nowrap;
}


/* ============================================================
   DESKTOP COMPACT
============================================================ */

@media (max-height: 310px) {

    .ems {
        padding:
            4px
            7px;
    }


    .program-badge {
        top: 3px;

        font-size: 12px;

        padding:
            3px
            7px;
    }


    .program-icon {
        font-size: 14px;
    }


    .top-row {
        padding-top: 14px;
    }


    .info-block {
        padding:
            3px
            6px;
    }


    .info-inner {
        grid-template-columns:
            28px
            auto;

        column-gap: 7px;
    }


    .big-icon {
        width: 28px;
        height: 28px;

        font-size: 24px;
    }


    .info-label {
        font-size: 12px;
    }


    .info-main {
        font-size: 17px;
    }


    .info-sub {
        margin-top: 2px;

        max-width: 160px;

        font-size: 12px;
    }


    .metric {
        padding:
            3px
            4px;
    }


    .metric-inner {
        grid-template-columns:
            26px
            auto;

        column-gap: 6px;
    }


    .metric-icon {
        width: 26px;

        font-size: 23px;
    }


    .metric-text {
        min-width: 55px;
    }


    .metric-label {
        font-size: 12px;
    }


    .metric-value {
        margin-top: 3px;

        font-size: 16px;
    }

}


/* ============================================================
   MOBILE
   MINDESTENS 12 px
============================================================ */

@media (max-width: 520px) {

    .ems {
        padding:
            5px
            4px;
    }


    /*
     * Tagesprogramm deutlich sichtbar.
     */

    .program-badge {
        top: 3px;

        max-width: 56%;

        padding:
            4px
            8px;

        font-size: 12px;
    }


    .program-icon {
        font-size: 17px;
    }


    .top-row {
        padding-top: 20px;
    }


    /*
     * Obere beiden Symbole auf Mobile grösser.
     */

    .info-block {
        padding:
            4px
            5px;
    }


    .info-inner {
        grid-template-columns:
            36px
            auto;

        column-gap: 7px;
    }


    .big-icon {
        width: 36px;
        height: 36px;

        font-size: 31px;
    }


    /*
     * Keine kleinen Texte mehr unter 12 px.
     */

    .info-label {
        font-size: 12px;
    }


    .info-main {
        margin-top: 3px;

        font-size: 18px;
    }


    .info-sub {
        margin-top: 3px;

        max-width: 135px;

        font-size: 12px;

        line-height: 1.15;
    }


    /*
     * Untere vier Symbole deutlich grösser.
     */

    .metric {
        padding:
            3px
            2px;
    }


    .metric-inner {
        grid-template-columns:
            32px
            auto;

        column-gap: 5px;
    }


    .metric-icon {
        width: 32px;

        font-size: 28px;
    }


    .metric-text {
        min-width: 0;
    }


    .metric-label {
        font-size: 12px;
    }


    .metric-value {
        margin-top: 3px;

        font-size: 17px;
    }

}


/* ============================================================
   GROSSE DESKTOPANSICHT
============================================================ */

@media
    (min-width: 900px)
    and
    (min-height: 500px)
{

    .ems {
        padding:
            18px
            28px;
    }


    .program-badge {
        top: 12px;

        padding:
            6px
            13px;

        font-size: 15px;
    }


    .program-icon {
        font-size: 19px;
    }


    .top-row {
        padding-top: 20px;
    }


    .info-block {
        padding:
            10px
            25px;
    }


    .info-inner {
        grid-template-columns:
            60px
            auto;

        column-gap: 20px;
    }


    .big-icon {
        width: 60px;
        height: 60px;

        font-size: 48px;
    }


    .info-label {
        font-size: 17px;
    }


    .info-main {
        margin-top: 5px;

        font-size: 31px;
    }


    .info-sub {
        margin-top: 7px;

        max-width: 390px;

        font-size: 15px;
    }


    .metric {
        padding:
            10px
            15px;
    }


    .metric-inner {
        grid-template-columns:
            48px
            auto;

        column-gap: 15px;
    }


    .metric-icon {
        width: 48px;

        font-size: 40px;
    }


    .metric-text {
        min-width: 100px;
    }


    .metric-label {
        font-size: 16px;
    }


    .metric-value {
        margin-top: 5px;

        font-size: 29px;
    }

}

</style>

</head>


<body>


<div class="ems">


    <!-- TAGESPROGRAMM -->

    <div
        class="program-badge"
        id="programBadge"
    >

        <span
            class="program-icon"
            id="programIcon"
        >
            ☀
        </span>

        <span
            class="program-text"
            id="program"
        >
            —
        </span>

    </div>



    <!-- ========================================================
         OBEN
    ========================================================= -->

    <div class="top-row">


        <!-- NÄCHSTES ZIEL -->

        <div class="info-block">

            <div class="info-inner">

                <div
                    class="
                        big-icon
                        target-icon
                    "
                >
                    ◎
                </div>


                <div class="info-text">

                    <div class="info-label">
                        Nächstes Ziel
                    </div>


                    <div
                        class="info-main"
                        id="target"
                    >
                        —
                    </div>


                    <div
                        class="info-sub"
                        id="targetSub"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>



        <!-- PV-PROGNOSE -->

        <div class="info-block">

            <div class="info-inner">

                <div
                    class="
                        big-icon
                        forecast-icon
                    "
                >
                    ▥
                </div>


                <div class="info-text">

                    <div class="info-label">
                        PV-Prognose
                    </div>


                    <div
                        class="info-main"
                        id="forecast"
                    >
                        —
                    </div>


                    <div
                        class="info-sub"
                        id="forecastSub"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>


    </div>



    <!-- ========================================================
         UNTEN
    ========================================================= -->

    <div class="bottom-row">


        <!-- PV -->

        <div class="metric">

            <div class="metric-inner">

                <div
                    class="
                        metric-icon
                        pv
                    "
                >
                    ☀
                </div>


                <div class="metric-text">

                    <div class="metric-label">
                        PV
                    </div>


                    <div
                        class="metric-value"
                        id="pv"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>



        <!-- NETZ -->

        <div class="metric">

            <div class="metric-inner">

                <div
                    class="
                        metric-icon
                        grid
                    "
                >
                    ↔
                </div>


                <div class="metric-text">

                    <div class="metric-label">
                        Netz
                    </div>


                    <div
                        class="metric-value"
                        id="grid"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>



        <!-- SOC -->

        <div class="metric">

            <div class="metric-inner">

                <div
                    class="
                        metric-icon
                        soc
                    "
                >
                    ▣
                </div>


                <div class="metric-text">

                    <div class="metric-label">
                        SOC
                    </div>


                    <div
                        class="metric-value"
                        id="soc"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>



        <!-- GESAMTLIMIT -->

        <div class="metric">

            <div class="metric-inner">

                <div
                    class="
                        metric-icon
                        limit
                    "
                >
                    ⚡
                </div>


                <div class="metric-text">

                    <div class="metric-label">
                        Gesamtlimit
                    </div>


                    <div
                        class="metric-value"
                        id="limit"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>


    </div>


</div>



<script>


function numeric(
    value,
    decimals = 1
) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return null;
    }

    return Number(value)
        .toFixed(decimals);
}


function power(value) {

    const result =
        numeric(
            value,
            1
        );

    if (result === null) {
        return "—";
    }

    return (
        result +
        " kW"
    );
}


function energy(value) {

    const result =
        numeric(
            value,
            1
        );

    if (result === null) {
        return "—";
    }

    return (
        result +
        " kWh"
    );
}


function percent(value) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return "—";
    }

    return (
        Math.round(
            Number(value)
        ) +
        " %"
    );
}


function setText(
    id,
    value
) {

    const element =
        document.getElementById(
            id
        );

    if (!element) {
        return;
    }

    element.textContent =
        value;
}


/*
 * Tagesprogramm-Symbol.
 * Erst einmal einfache Zuordnung.
 */

function programIcon(
    program
) {

    const value =
        String(
            program || ""
        ).toLowerCase();


    if (
        value.includes(
            "hochsommer"
        ) ||
        value.includes(
            "sommer"
        )
    ) {
        return "☀";
    }


    if (
        value.includes(
            "winter"
        )
    ) {
        return "❄";
    }


    if (
        value.includes(
            "übergang"
        ) ||
        value.includes(
            "uebergang"
        )
    ) {
        return "◐";
    }


    return "●";
}


function handleMessage(data) {

    if (
        typeof data ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }

    }


    if (
        !data ||
        typeof data !==
        "object"
    ) {
        return;
    }



    /* ========================================================
       TAGESPROGRAMM
    ========================================================= */

    const program =
        data.program
            ? String(
                data.program
            )
            : "—";


    setText(
        "program",
        program
    );


    setText(
        "programIcon",
        programIcon(
            program
        )
    );



    /* ========================================================
       NÄCHSTES ZIEL
    ========================================================= */

    let targetText =
        "—";


    if (
        data.targetTime !== null &&
        data.targetTime !== undefined &&
        data.targetTime !== "" &&
        data.targetSOC !== null &&
        data.targetSOC !== undefined
    ) {

        targetText =
            String(
                data.targetTime
            ) +
            " / " +
            Math.round(
                Number(
                    data.targetSOC
                )
            ) +
            " %";
    }


    setText(
        "target",
        targetText
    );


    let targetDetails =
        [];


    const need =
        power(
            data.socNeed
        );


    if (
        need !== "—"
    ) {

        targetDetails.push(
            "SOC-Ladebedarf " +
            need
        );
    }


    if (
        data.consumers !== null &&
        data.consumers !== undefined &&
        data.consumers !== ""
    ) {

        targetDetails.push(
            "Verbraucher " +
            data.consumers
        );
    }


    setText(
        "targetSub",

        targetDetails.length
            ? targetDetails.join(
                " · "
            )
            : "—"
    );



    /* ========================================================
       PV-PROGNOSE
    ========================================================= */

    setText(
        "forecast",
        energy(
            data.forecastEnergy
        )
    );


    let forecastDetails =
        [];


    const peak =
        power(
            data.forecastPeak
        );


    if (
        peak !== "—"
    ) {

        forecastDetails.push(
            "Peak " +
            peak
        );
    }


    const duration =
        numeric(
            data.forecastDuration,
            1
        );


    if (
        duration !== null
    ) {

        forecastDetails.push(
            "Dauer " +
            duration +
            " h"
        );
    }


    setText(
        "forecastSub",

        forecastDetails.length
            ? forecastDetails.join(
                " · "
            )
            : "—"
    );



    /* ========================================================
       UNTEN
    ========================================================= */

    setText(
        "pv",
        power(
            data.pv
        )
    );


    setText(
        "grid",
        power(
            data.grid
        )
    );


    setText(
        "soc",
        percent(
            data.soc
        )
    );


    setText(
        "limit",
        power(
            data.limit
        )
    );

}



window.addEventListener(
    "load",
    function () {

        if (
            typeof requestAction ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );

        }

    }
);


</script>


</body>

</html>
