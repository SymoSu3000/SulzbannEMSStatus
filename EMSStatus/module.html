<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<style>

/* ============================================================
   BASIS
============================================================ */

* {
    box-sizing: border-box;
}


:root {
    color-scheme: light dark;

    --text: #20262b;
    --muted: #66737b;

    --border:
        rgba(0, 0, 0, 0.14);

    --yellow: #e5a900;
    --blue: #149be3;
    --green: #00b87a;
    --orange: #f28a1b;
    --purple: #a34fe0;
}


@media (prefers-color-scheme: dark) {

    :root {
        --text: #f2f7fa;
        --muted: #a7bdc9;

        --border:
            rgba(120, 160, 178, 0.30);

        --yellow: #ffc83d;
        --blue: #32a7f4;
        --green: #25da91;
        --orange: #ff9d2d;
        --purple: #bb70ff;
    }

}


html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* ============================================================
   HAUPTLAYOUT

   Desktop/Laptop Compact:
   - oberer Freiraum gehört dem Symcon-Kacheltitel
   - darunter 3 geschlossene Bereiche
============================================================ */

.ems {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows:
        minmax(0, 1fr)
        auto
        minmax(0, 1fr);

    overflow: hidden;

    /*
     * Oben genügend Abstand zum Symcon-Titel.
     */
    padding:
        34px
        10px
        9px
        10px;

    background: transparent;
}


/* ============================================================
   OBERE REIHE
   NÄCHSTES ZIEL | PV-PROGNOSE
============================================================ */

.top-row {
    width: 100%;
    min-height: 0;

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    align-items: stretch;

    /*
     * Diese Linie bildet gleichzeitig
     * den oberen Abschluss der Programmzeile.
     */
    border-bottom:
        1px solid
        var(--border);
}


.info-block {
    min-width: 0;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        7px
        12px;
}


/*
 * Senkrechte Linie exakt bis
 * zur horizontalen Linie.
 */

.info-block + .info-block {
    border-left:
        1px solid
        var(--border);
}


.info-inner {
    min-width: 0;

    display: grid;

    grid-template-columns:
        38px
        minmax(0, auto);

    column-gap: 10px;

    align-items: center;
}


/* ============================================================
   OBERE SYMBOLE
============================================================ */

.big-icon {
    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 30px;

    line-height: 1;
}


.target-icon {
    color: var(--purple);
}


.forecast-icon {
    color: var(--yellow);
}


/* ============================================================
   OBERE TEXTE

   DESKTOP:
   Mindestgrösse = 13 px
============================================================ */

.info-text {
    min-width: 0;

    text-align: left;
}


.info-label {
    color: var(--muted);

    font-size: 13px;

    line-height: 1.15;

    white-space: nowrap;
}


.info-main {
    margin-top: 4px;

    color: var(--text);

    font-size: 19px;

    line-height: 1.05;

    font-weight: 700;

    white-space: nowrap;
}


.info-sub {
    margin-top: 5px;

    max-width: 205px;

    overflow: hidden;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.15;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   MITTLERE REIHE
   TAGESPROGRAMM
============================================================ */

.program-row {
    width: 100%;

    min-height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        6px
        10px;

    /*
     * Keine obere Linie:
     * diese kommt bereits von .top-row.
     */

    border-bottom:
        1px solid
        var(--border);
}


.program-line {
    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    text-align: center;
}


.program-icon {
    flex: 0 0 auto;

    color: var(--yellow);

    font-size: 20px;

    line-height: 1;
}


.program-text {
    min-width: 0;

    overflow: hidden;

    color: var(--text);

    font-size: 14px;

    font-weight: 650;

    line-height: 1.15;

    text-align: center;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* ============================================================
   UNTERE REIHE
   PV | NETZ | SOC | GESAMTLIMIT
============================================================ */

.bottom-row {
    width: 100%;
    min-height: 0;

    display: grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0, 1fr)
        );

    align-items: stretch;
}


.metric {
    min-width: 0;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        6px
        3px;
}


.metric + .metric {
    /*
     * Beginnt exakt an der Linie
     * unterhalb der Programmzeile.
     */
    border-left:
        1px solid
        var(--border);
}


/*
 * Jedes Viertel ist identisch aufgebaut:
 *
 *     [ Symbol ] Bezeichnung
 *
 *           Wert
 */

.metric-inner {
    width: 100%;
    height: 100%;

    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}


.metric-head {
    min-width: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;
}


.metric-icon {
    flex: 0 0 auto;

    width: 28px;
    height: 28px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 25px;

    line-height: 1;
}


.metric-icon.pv {
    color: var(--yellow);
}


.metric-icon.grid {
    color: var(--blue);
}


.metric-icon.soc {
    color: var(--green);
}


.metric-icon.limit {
    color: var(--orange);
}


.metric-label {
    color: var(--muted);

    font-size: 13px;

    line-height: 1.1;

    white-space: nowrap;

    text-align: center;
}


.metric-value {
    margin-top: 7px;

    color: var(--text);

    font-size: 19px;

    line-height: 1;

    font-weight: 700;

    white-space: nowrap;

    text-align: center;
}


/* ============================================================
   DESKTOP / LAPTOP COMPACT

   Wichtig:
   Keine Tablet-Erkennung über die Kachelbreite.

   Eine 500px breite Kachel auf einem 17"-Laptop
   bleibt Desktop.
============================================================ */

@media
    (hover: hover)
    and
    (pointer: fine)
{

    .info-label,
    .info-sub,
    .metric-label {
        /*
         * Schrift-Test Zeile 06
         */
        font-size: 13px;
    }

}


/* ============================================================
   GROSSE DESKTOP-/LAPTOP-ANSICHT
============================================================ */

@media
    (hover: hover)
    and
    (pointer: fine)
    and
    (min-height: 500px)
{

    .ems {
        padding:
            44px
            28px
            18px
            28px;
    }


    .info-block {
        padding:
            12px
            25px;
    }


    .info-inner {
        grid-template-columns:
            58px
            minmax(0, auto);

        column-gap: 18px;
    }


    .big-icon {
        width: 58px;
        height: 58px;

        font-size: 46px;
    }


    .info-label {
        font-size: 16px;
    }


    .info-main {
        margin-top: 6px;

        font-size: 30px;
    }


    .info-sub {
        margin-top: 7px;

        max-width: 400px;

        font-size: 15px;
    }


    .program-row {
        min-height: 48px;

        padding:
            9px
            12px;
    }


    .program-icon {
        font-size: 23px;
    }


    .program-text {
        font-size: 17px;
    }


    .metric-head {
        gap: 12px;
    }


    .metric-icon {
        width: 45px;
        height: 45px;

        font-size: 40px;
    }


    .metric-label {
        font-size: 16px;
    }


    .metric-value {
        margin-top: 10px;

        font-size: 29px;
    }

}


/* ============================================================
   MOBILE

   Mobile wird NICHT anhand einer kleinen Kachelbreite erkannt,
   sondern über Touch / coarse pointer.

   Mindestgrösse:
   Schrift-Test Zeile 05 = 12 px
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
{

    .ems {
        /*
         * Symcon Mobile hat einen grossen Titelbereich.
         */
        padding:
            42px
            8px
            9px
            8px;
    }


    /* --------------------------------------------------------
       OBEN
    --------------------------------------------------------- */

    .info-block {
        padding:
            6px
            5px;
    }


    .info-inner {
        grid-template-columns:
            39px
            minmax(0, auto);

        column-gap: 8px;
    }


    /*
     * Symbole bewusst grösser auf Mobile.
     */

    .big-icon {
        width: 39px;
        height: 39px;

        font-size: 34px;
    }


    .info-label {
        font-size: 12px;
    }


    .info-main {
        margin-top: 4px;

        font-size: 19px;
    }


    .info-sub {
        margin-top: 4px;

        max-width: 150px;

        font-size: 12px;

        line-height: 1.15;
    }


    /* --------------------------------------------------------
       PROGRAMM
    --------------------------------------------------------- */

    .program-row {
        min-height: 38px;

        padding:
            6px
            8px;
    }


    .program-line {
        gap: 9px;
    }


    .program-icon {
        font-size: 22px;
    }


    .program-text {
        font-size: 14px;

        font-weight: 650;
    }


    /* --------------------------------------------------------
       UNTEN
    --------------------------------------------------------- */

    .metric {
        padding:
            5px
            2px;
    }


    .metric-head {
        gap: 6px;
    }


    .metric-icon {
        width: 33px;
        height: 33px;

        font-size: 30px;
    }


    .metric-label {
        font-size: 12px;
    }


    .metric-value {
        margin-top: 8px;

        font-size: 19px;
    }

}


/* ============================================================
   MOBILE DETAIL

   Geöffnete Ansicht auf Smartphone.
============================================================ */

@media
    (hover: none)
    and
    (pointer: coarse)
    and
    (min-height: 650px)
{

    .info-main {
        font-size: 20px;
    }


    .metric-value {
        font-size: 20px;
    }

}

</style>

</head>


<body>


<div class="ems">


    <!-- ========================================================
         OBEN
    ========================================================= -->

    <div class="top-row">


        <!-- NÄCHSTES ZIEL -->

        <div class="info-block">

            <div class="info-inner">

                <div
                    class="
                        big-icon
                        target-icon
                    "
                >
                    ◎
                </div>


                <div class="info-text">

                    <div class="info-label">
                        Nächstes Ziel
                    </div>


                    <div
                        class="info-main"
                        id="target"
                    >
                        —
                    </div>


                    <div
                        class="info-sub"
                        id="targetSub"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>



        <!-- PV-PROGNOSE -->

        <div class="info-block">

            <div class="info-inner">

                <div
                    class="
                        big-icon
                        forecast-icon
                    "
                >
                    ▥
                </div>


                <div class="info-text">

                    <div class="info-label">
                        PV-Prognose
                    </div>


                    <div
                        class="info-main"
                        id="forecast"
                    >
                        —
                    </div>


                    <div
                        class="info-sub"
                        id="forecastSub"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>


    </div>



    <!-- ========================================================
         MITTE
         PROGRAMM
    ========================================================= -->

    <div class="program-row">

        <div class="program-line">

            <span
                class="program-icon"
                id="programIcon"
            >
                ☀
            </span>


            <span
                class="program-text"
                id="program"
            >
                —
            </span>

        </div>

    </div>



    <!-- ========================================================
         UNTEN
    ========================================================= -->

    <div class="bottom-row">


        <!-- PV -->

        <div class="metric">

            <div class="metric-inner">

                <div class="metric-head">

                    <div
                        class="
                            metric-icon
                            pv
                        "
                    >
                        ☀
                    </div>


                    <div class="metric-label">
                        PV
                    </div>

                </div>


                <div
                    class="metric-value"
                    id="pv"
                >
                    —
                </div>

            </div>

        </div>



        <!-- NETZ -->

        <div class="metric">

            <div class="metric-inner">

                <div class="metric-head">

                    <div
                        class="
                            metric-icon
                            grid
                        "
                    >
                        ↔
                    </div>


                    <div class="metric-label">
                        Netz
                    </div>

                </div>


                <div
                    class="metric-value"
                    id="grid"
                >
                    —
                </div>

            </div>

        </div>



        <!-- SOC -->

        <div class="metric">

            <div class="metric-inner">

                <div class="metric-head">

                    <div
                        class="
                            metric-icon
                            soc
                        "
                    >
                        ▣
                    </div>


                    <div class="metric-label">
                        SOC
                    </div>

                </div>


                <div
                    class="metric-value"
                    id="soc"
                >
                    —
                </div>

            </div>

        </div>



        <!-- GESAMTLIMIT -->

        <div class="metric">

            <div class="metric-inner">

                <div class="metric-head">

                    <div
                        class="
                            metric-icon
                            limit
                        "
                    >
                        ⚡
                    </div>


                    <div class="metric-label">
                        Gesamtlimit
                    </div>

                </div>


                <div
                    class="metric-value"
                    id="limit"
                >
                    —
                </div>

            </div>

        </div>


    </div>


</div>



<script>


/* ============================================================
   FORMATIERUNG
============================================================ */

function numeric(
    value,
    decimals = 1
) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return null;
    }


    return Number(value)
        .toFixed(decimals);
}



function power(value) {

    const result =
        numeric(
            value,
            1
        );


    if (result === null) {
        return "—";
    }


    return (
        result +
        " kW"
    );
}



function energy(value) {

    const result =
        numeric(
            value,
            1
        );


    if (result === null) {
        return "—";
    }


    return (
        result +
        " kWh"
    );
}



function percent(value) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return "—";
    }


    return (
        Math.round(
            Number(value)
        ) +
        " %"
    );
}



function setText(
    id,
    value
) {

    const element =
        document.getElementById(
            id
        );


    if (!element) {
        return;
    }


    element.textContent =
        value;
}



/* ============================================================
   PROGRAMMSYMBOL
============================================================ */

function getProgramIcon(
    program
) {

    const value =
        String(
            program || ""
        ).toLowerCase();


    if (
        value.includes("hochsommer") ||
        value.includes("sommer")
    ) {
        return "☀";
    }


    if (
        value.includes("winter")
    ) {
        return "❄";
    }


    if (
        value.includes("übergang") ||
        value.includes("uebergang")
    ) {
        return "◐";
    }


    return "●";
}



/* ============================================================
   LIVE DATEN
============================================================ */

function handleMessage(data) {

    if (
        typeof data ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }

    }


    if (
        !data ||
        typeof data !==
        "object"
    ) {
        return;
    }



    /* ========================================================
       PROGRAMM
    ========================================================= */

    const program =
        data.program
            ? String(
                data.program
            )
            : "—";


    setText(
        "program",
        program
    );


    setText(
        "programIcon",
        getProgramIcon(
            program
        )
    );



    /* ========================================================
       NÄCHSTES ZIEL
    ========================================================= */

    let targetText =
        "—";


    if (
        data.targetTime !== null &&
        data.targetTime !== undefined &&
        data.targetTime !== "" &&
        data.targetSOC !== null &&
        data.targetSOC !== undefined
    ) {

        targetText =
            String(
                data.targetTime
            ) +
            " / " +
            Math.round(
                Number(
                    data.targetSOC
                )
            ) +
            " %";
    }


    setText(
        "target",
        targetText
    );


    /*
     * Verbraucher-Anzahl wird hier bewusst
     * NICHT mehr angezeigt.
     */

    const need =
        power(
            data.socNeed
        );


    if (
        need !== "—"
    ) {

        setText(
            "targetSub",
            "SOC-Ladebedarf " +
            need
        );

    } else {

        setText(
            "targetSub",
            "—"
        );

    }



    /* ========================================================
       PV-PROGNOSE
    ========================================================= */

    setText(
        "forecast",
        energy(
            data.forecastEnergy
        )
    );


    let forecastDetails =
        [];


    const peak =
        power(
            data.forecastPeak
        );


    if (
        peak !== "—"
    ) {

        forecastDetails.push(
            "Peak " +
            peak
        );
    }


    const duration =
        numeric(
            data.forecastDuration,
            1
        );


    if (
        duration !== null
    ) {

        forecastDetails.push(
            "Dauer " +
            duration +
            " h"
        );
    }


    setText(
        "forecastSub",

        forecastDetails.length
            ? forecastDetails.join(
                " · "
            )
            : "—"
    );



    /* ========================================================
       UNTERE WERTE
    ========================================================= */

    setText(
        "pv",
        power(
            data.pv
        )
    );


    setText(
        "grid",
        power(
            data.grid
        )
    );


    setText(
        "soc",
        percent(
            data.soc
        )
    );


    setText(
        "limit",
        power(
            data.limit
        )
    );

}



/* ============================================================
   INITIALISIERUNG
============================================================ */

window.addEventListener(
    "load",
    function () {

        if (
            typeof requestAction ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );

        }

    }
);


</script>


</body>

</html>
